<line x1="0" y1="44" x2="880" y2="44" stroke="#d0d7de"/>
<g class="fade"><text x="32" y="98" class="sans" font-size="38" font-weight="700" fill="#1f2328" letter-spacing="-0.5">Park Dongkyu<tspan dx="12" font-size="20" font-weight="500" letter-spacing="0" fill="#59636e">박동규</tspan></text><text x="34" y="128" class="mono" font-size="14" fill="#59636e"><tspan fill="#1a7f37">❯</tspan> backend engineer — chasing root causes, shipping measured fixes<tspan class="blink" dx="4" fill="#1a7f37">▍</tspan></text></g>
